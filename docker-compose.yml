services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hmpi
      POSTGRES_USER: hmpi
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmpi -d hmpi"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "change-me-before-production"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgresql://hmpi:change-me@db:5432/hmpi"
      CORS_ALLOWED_ORIGINS: "http://localhost:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
